name: Desktop Build

# Builds installable bundles for every supported OS/architecture and uploads them
# as workflow artifacts. Releases are published by publish.yml.

on:
  pull_request:
    branches: [main, cross-platform]
  push:
    branches: [cross-platform]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          # Cross-compiled on x64; WiX (MSI) cannot target ARM64, NSIS can.
          - name: Windows ARM64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev clang libclang-dev patchelf rpm file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run bundle:plugins

      - name: Rust tests
        # Cross-compiled targets cannot run on the build machine.
        if: matrix.target != 'aarch64-pc-windows-msvc'
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.target }}

      - name: Build bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXTRA_CONFIG=()
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            # Updater artifacts must be signed; skip them when no key is configured.
            EXTRA_CONFIG=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          bun run tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${EXTRA_CONFIG[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: openusage-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
